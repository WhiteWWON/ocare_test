spring:
  application:
    name: Ocare

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # [주의] serverTimezone 설정은 필수이며, useSSL은 보안 설정에 따라 true/false를 선택합니다.
    url: jdbc:mysql://localhost:3306/mysql?serverTimezone=Asia/Seoul&useCharacterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ocare
    password: 1234

  jpa:
    hibernate:
      # create: 기존 테이블 삭제 후 재생성, update: 변경분만 반영
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # MySQL 8 버전에 최적화된 SQL 문법 사용
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: localhost
      port: 6379